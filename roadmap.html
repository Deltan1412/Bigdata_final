<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Roadmap</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e1e5ec; --accent:#2f6fed; --done:#1f9d55; --partial:#e29a1a; --todo:#aab2c0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d2128; --text:#e6e9ef; --muted:#9aa3b2; --line:#2e343e; --accent:#6d9bff; --done:#3fbf7a; --partial:#f0b23c; --todo:#5b6474; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0 18px; }
  button { font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:6px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .status-msg { color:var(--muted); font-size:12px; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:var(--accent); transition:width .2s; }
  .overall { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:16px; }
  .overall .row, .phase-head .row { display:flex; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:6px; }
  .phase { background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:16px; }
  .phase-head { padding:12px 14px; border-bottom:1px solid var(--line); }
  .phase-head h2 { font-size:16px; margin:0 0 2px; }
  .phase-head p { margin:0 0 8px; color:var(--muted); font-size:13px; }
  .counts { color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  li.task { display:flex; gap:10px; align-items:flex-start; padding:8px 14px; border-bottom:1px solid var(--line); }
  li.task:last-child { border-bottom:0; }
  .st { flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--todo); background:transparent; color:#fff; padding:0; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .st.partial { border-color:var(--partial); background:linear-gradient(90deg, var(--partial) 50%, transparent 50%); }
  .st.done { border-color:var(--done); background:var(--done); }
  .body { flex:1; min-width:0; }
  .text { cursor:text; word-wrap:break-word; }
  .done .text { color:var(--muted); text-decoration:line-through; }
  .note { color:var(--muted); font-size:12.5px; cursor:text; }
  .note.empty { opacity:.5; }
  .tag { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--partial); color:var(--partial); margin-left:6px; vertical-align:middle; }
  .del { flex:none; border:0; background:transparent; color:var(--muted); font-size:16px; padding:0 4px; }
  .del:hover { color:#d33; }
  input.edit { width:100%; font:inherit; padding:3px 6px; border:1px solid var(--accent); border-radius:4px; background:var(--card); color:var(--text); }
  form.add { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  form.add input { flex:1; font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
  .legend { font-size:12px; color:var(--muted); margin-bottom:10px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Roadmap</h1>
  <div class="sub">Click the circle to cycle: to-do &rarr; partial &rarr; done. Click text or note to edit. Progress = done + &frac12; partial.</div>

  <div class="toolbar">
    <button id="btn-link" title="Pick roadmap.json; every change is then saved straight into that file (Chrome / Edge)">Link roadmap.json (auto-save)</button>
    <button id="btn-export">Export JSON</button>
    <button id="btn-import">Import JSON</button>
    <button id="btn-reset">Reset to original</button>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
    <span class="status-msg" id="save-msg"></span>
  </div>

  <div class="overall">
    <div class="row"><strong>Overall</strong><span id="overall-text"></span></div>
    <div class="bar"><span id="overall-bar"></span></div>
  </div>

  <div id="phases"></div>
  <div class="legend">Saved automatically in this browser (localStorage). Use Export JSON, or Link roadmap.json, to keep the file in the project folder up to date.</div>
</main>

<script>
(function () {
  var LS_KEY = 'm5-roadmap-v1';
  var SEED = JSON.parse(document.getElementById('seed').textContent);
  var data, fileHandle = null;

  function load() {
    try { var s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch (e) {}
    return JSON.parse(JSON.stringify(SEED));
  }
  function msg(t) { document.getElementById('save-msg').textContent = t; }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
    if (fileHandle) {
      fileHandle.createWritable().then(function (w) {
        return w.write(JSON.stringify(data, null, 2)).then(function () { return w.close(); });
      }).then(function () { msg('Saved to ' + fileHandle.name + ' at ' + new Date().toLocaleTimeString()); })
        .catch(function (e) { msg('File save failed: ' + e.message); });
    } else { msg('Saved in browser at ' + new Date().toLocaleTimeString()); }
  }
  function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function score(tasks) {
    var d = 0, p = 0;
    tasks.forEach(function (t) { if (t.status === 'done') d++; else if (t.status === 'partial') p++; });
    return { done: d, partial: p, todo: tasks.length - d - p, pct: tasks.length ? Math.round((d + p / 2) / tasks.length * 100) : 0 };
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function inlineEdit(node, value, onSave) {
    var input = el('input', 'edit'); input.value = value;
    node.replaceWith(input); input.focus(); input.select();
    var finished = false;
    function finish(ok) { if (finished) return; finished = true; if (ok) onSave(input.value.trim()); render(); }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
    input.addEventListener('blur', function () { finish(true); });
  }

  function render() {
    var root = document.getElementById('phases'); root.textContent = '';
    document.getElementById('title').textContent = data.title || 'Roadmap';
    var all = [];
    data.phases.forEach(function (ph) {
      all = all.concat(ph.tasks);
      var sc = score(ph.tasks);
      var box = el('section', 'phase');
      var head = el('div', 'phase-head');
      head.appendChild(el('h2', null, ph.name));
      if (ph.description) head.appendChild(el('p', null, ph.description));
      var row = el('div', 'row');
      row.appendChild(el('span', 'counts', sc.done + ' done · ' + sc.partial + ' partial · ' + sc.todo + ' to-do'));
      row.appendChild(el('strong', null, sc.pct + '%'));
      head.appendChild(row);
      var bar = el('div', 'bar'); var fill = el('span'); fill.style.width = sc.pct + '%'; bar.appendChild(fill); head.appendChild(bar);
      box.appendChild(head);

      var ul = el('ul');
      ph.tasks.forEach(function (t) {
        var li = el('li', 'task ' + t.status);
        var st = el('button', 'st ' + t.status, t.status === 'done' ? '✓' : '');
        st.title = t.status === 'done' ? 'Done (click: back to to-do)' : t.status === 'partial' ? 'Partially done (click: mark done)' : 'To-do (click: mark partial)';
        st.addEventListener('click', function () {
          t.status = t.status === 'todo' ? 'partial' : t.status === 'partial' ? 'done' : 'todo';
          save(); render();
        });
        var body = el('div', 'body');
        var text = el('div', 'text', t.text);
        if (t.status === 'partial') text.appendChild(el('span', 'tag', 'partial'));
        text.addEventListener('click', function () { inlineEdit(text, t.text, function (v) { if (v) { t.text = v; save(); } }); });
        var note = el('div', 'note' + (t.note ? '' : ' empty'), t.note || 'add note…');
        note.addEventListener('click', function () { inlineEdit(note, t.note || '', function (v) { t.note = v; save(); }); });
        body.appendChild(text); body.appendChild(note);
        var del = el('button', 'del', '×'); del.title = 'Delete task';
        del.addEventListener('click', function () {
          if (confirm('Delete this task?\n\n' + t.text)) { ph.tasks = ph.tasks.filter(function (x) { return x !== t; }); save(); render(); }
        });
        li.appendChild(st); li.appendChild(body); li.appendChild(del); ul.appendChild(li);
      });
      box.appendChild(ul);

      var form = el('form', 'add');
      var inp = el('input'); inp.placeholder = 'Add a to-do to this phase…';
      var btn = el('button', null, 'Add'); btn.type = 'submit';
      form.appendChild(inp); form.appendChild(btn);
      form.addEventListener('submit', function (e) {
        e.preventDefault(); var v = inp.value.trim(); if (!v) return;
        ph.tasks.push({ id: uid(), text: v, status: 'todo', note: '' }); save(); render();
      });
      box.appendChild(form);
      root.appendChild(box);
    });
    var o = score(all);
    document.getElementById('overall-text').textContent = o.done + ' done · ' + o.partial + ' partial · ' + o.todo + ' to-do of ' + all.length + ' (' + o.pct + '%)';
    document.getElementById('overall-bar').style.width = o.pct + '%';
  }

  function validate(d) { return d && Array.isArray(d.phases) && d.phases.every(function (p) { return p && Array.isArray(p.tasks); }); }

  document.getElementById('btn-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'roadmap.json';
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById('btn-import').addEventListener('click', function () { document.getElementById('file-import').click(); });
  document.getElementById('file-import').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (txt) {
      var d = JSON.parse(txt);
      if (!validate(d)) throw new Error('not a roadmap file');
      data = d; save(); render();
    }).catch(function (err) { alert('Import failed: ' + err.message); });
    e.target.value = '';
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (confirm('Discard all changes made in this browser and go back to the original roadmap?')) {
      data = JSON.parse(JSON.stringify(SEED)); save(); render();
    }
  });
  var linkBtn = document.getElementById('btn-link');
  if (!window.showOpenFilePicker) { linkBtn.disabled = true; linkBtn.title = 'Needs Chrome or Edge'; }
  linkBtn.addEventListener('click', function () {
    window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] }).then(function (hs) {
      var h = hs[0];
      return h.requestPermission({ mode: 'readwrite' }).then(function (perm) {
        if (perm !== 'granted') throw new Error('write permission denied');
        return h.getFile();
      }).then(function (f) { return f.text(); }).then(function (txt) {
        var d = JSON.parse(txt);
        if (!validate(d)) throw new Error('not a roadmap file');
        data = d; fileHandle = h; linkBtn.textContent = 'Linked: ' + h.name; save(); render();
      });
    }).catch(function (e) { if (e.name !== 'AbortError') alert('Link failed: ' + e.message); });
  });

  data = load(); render(); msg('');
})();
</script>
</body>
</html>
